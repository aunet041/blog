# Site settings
title: "素人プラモデル制作日記"
tagline: "プラモデル・フィギュアのレビューと製作記録"
email: aunet041@gmail.com
description: "初心者による初心者のためのプラモデル制作日記。プラモデルやフィギュアのレビュー、製作記録を掲載しています。"
baseurl: ""
url: "https://example.com" # 本番用URLに変更してください
author:
  name: "管理人"
  email: "aunet041@gmail.com"

# SEO settings
twitter:
  username: your-twitter-handle
  card: summary_large_image
facebook:
  app_id: your-fb-app-id
  publisher: your-fb-page-url
social:
  name: 素人プラモデル制作日記
  links:
    - https://twitter.com/your-twitter-handle
    - https://www.facebook.com/your-facebook-page

# Build settings
theme: jekyll-theme-minimal
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Custom settings
show_downloads: false
google_analytics: # あなたのGoogle AnalyticsのID

# Category Display Names
category_names:
  model-examples: "プラモデル作成例"
  model-techniques: "プラモデル制作テクニック"
  tool-reviews: "工具・素材レビュー"
  kit-reviews: "キットレビュー"
  figure-reviews: "フィギュア"

# Collections
collections:
  reviews:
    output: true
    permalink: /reviews/:path/

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/default-ogp.jpg
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "管理人"
      comments: true
      image: /assets/images/default-ogp.jpg
  - scope:
      path: "categories"
    values:
      layout: category
      image: /assets/images/category-ogp.jpg

# Exclude from processing.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
